# OAuth error messages
error.use_oauth_login=Tài khoản này không có mật khẩu. Vui lòng đăng nhập bằng tài khoản mạng xã hội đã liên kết.
error.email_registered_via_oauth=Email này đã được đăng ký bằng tài khoản mạng xã hội. Vui lòng đăng nhập bằng phương thức đó.
error.oauth_profile_invalid=Tài khoản mạng xã hội không trả về email đã được xác minh.
error.oauth_provider_unsupported=Phương thức đăng nhập này không được hỗ trợ.
error.google_account_mismatch=Tài khoản này đã được liên kết với một tài khoản Google khác.
