databaseChangeLog:
  - changeSet:
      id: 007-create-refresh-token-table
      author: Haichan
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: timestamp

              - column:
                  name: replaced_by_token_hash
                  type: varchar(64)

        - addForeignKeyConstraint:
            baseTableName: refresh_token
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_refresh_token_user

        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_user_id
            columns:
              - column:
                  name: user_id
