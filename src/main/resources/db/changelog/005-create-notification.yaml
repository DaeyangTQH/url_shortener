databaseChangeLog:
  - changeSet:
      id: 005-create-notification-tables
      author: Haichan
      changes:
        - createTable:
            tableName: notification_template
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: template_key
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: channel
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: subject_template
                  type: varchar(500)
              - column:
                  name: template_path
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: is_deleted
                  type: boolean
                  constraints:
                    nullable: false

        - createTable:
            tableName: user_notification
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: notification_template_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: timestamp
              - column:
                  name: failed_at
                  type: timestamp
              - column:
                  name: error_message
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_notification
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_user_notification_user

        - addForeignKeyConstraint:
            baseTableName: user_notification
            baseColumnNames: notification_template_id
            referencedTableName: notification_template
            referencedColumnNames: id
            constraintName: fk_user_notification_template

        - createIndex:
            tableName: user_notification
            indexName: idx_user_notification_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: user_notification
            indexName: idx_user_notification_template_id
            columns:
              - column:
                  name: notification_template_id

        - createIndex:
            tableName: user_notification
            indexName: idx_user_notification_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: user_notification
            indexName: idx_user_notification_created_at
            columns:
              - column:
                  name: created_at
