databaseChangeLog:
  - changeSet:
      id: 004-create-user-identity
      author: Haichan
      changes:
        - createTable:
            tableName: user_identity
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: provider
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: provider_user_id
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: provider_email
                  type: varchar(255)

              - column:
                  name: is_email_verified
                  type: boolean

              - column:
                  name: linked_at
                  type: timestamp

              - column:
                  name: last_login_at
                  type: timestamp

              - column:
                  name: is_primary
                  type: boolean

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp

              - column:
                  name: deleted_at
                  type: timestamp

              - column:
                  name: is_deleted
                  type: boolean
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_identity
            baseColumnNames: user_id
            referencedTableName: user
            referencedColumnNames: id
            constraintName: fk_user_identity_user

        - addUniqueConstraint:
            tableName: user_identity
            columnNames: provider, provider_user_id
            constraintName: uk_user_identity_provider_user

        - createIndex:
            tableName: user_identity
            indexName: idx_user_identity_user_id
            columns:
              - column:
                  name: user_id
