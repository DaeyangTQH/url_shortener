spring:
  application:
    name: url_shortener

  messages:
    basename: i18n/messages
    encoding: UTF-8


  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    enabled: true

jwt:
  secret-key: ${JWT_SECRET}
  issuer: url_shortener
  expiration-minutes: 30

server:
  port: 8080
