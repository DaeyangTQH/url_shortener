spring:
  application:
    name: url_shortener

  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: admin
    password: admin123

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    enabled: true
