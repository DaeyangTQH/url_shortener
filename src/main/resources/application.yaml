spring:
  application:
    name: url_shortener

  messages:
    basename: i18n/messages
    encoding: UTF-8


  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  data:
    redis:
      host: localhost
      port: 6379

  liquibase:
    change-log: classpath:db/db.changelog-master.yaml
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

jwt:
  secret-key: ${JWT_SECRET}
  issuer: url_shortener
  expiration-minutes: 60
  refresh-expiration-days: 15

app:
  oauth2:
    frontend-redirect-url: http://localhost:5173
  base-url: http://localhost:8080

server:
  port: 8080
